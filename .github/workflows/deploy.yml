name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/soundwave-backend:latest

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/soundwave-backend:latest
            docker stop soundwave || true
            docker rm soundwave || true
            docker run -d \
              --name soundwave \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --env-file /home/ubuntu/soundwave.env \
              ${{ secrets.DOCKER_USERNAME }}/soundwave-backend:latest
